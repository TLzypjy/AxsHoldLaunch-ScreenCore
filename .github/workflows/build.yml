name: Build ScreenCore beautify.40 (rootless)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build rootless beautify.40
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Pin Package Version
        run: |
          # The final deliverable version is fixed; do NOT use 5.2.0-run_number.
          VERSION="2.0.5+beautify.40"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build Tweak (rootless, arm64 + arm64e)
        run: |
          set -euo pipefail
          sh build.sh rootless
          echo "=== intermediate .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Verify compiled dylib (arches + symbols)
        run: |
          set -euo pipefail
          EXTRACT="$(mktemp -d)"
          DEB=$(find ./packages -name "*.deb" | head -n 1)
          test -n "$DEB"
          dpkg-deb -x "$DEB" "$EXTRACT"
          DYLIB=$(find "$EXTRACT" -name "AxsHoldLaunch.dylib" | head -n 1)
          test -n "$DYLIB"
          echo "=== lipo -archs ==="
          lipo -archs "$DYLIB"
          lipo -archs "$DYLIB" | grep -q "arm64"
          lipo -archs "$DYLIB" | grep -q "arm64e"
          echo "=== required symbols ==="
          for sym in splitBeautifyRingFrameColor UIColorPickerViewController com.susudear.screencoreprefs \
                     colorPickerViewControllerDidFinish: colorPickerViewControllerDidSelectColor: \
                     colorPickerControllerDidFinish: \
                     splitBeautifyGlowEnabled splitBeautifyGlowCustomEnabled \
                     splitBeautifyGlowColor splitBeautifyGlowRadius \
                     splitBeautifyGlowBrightness ; do
            strings -a "$DYLIB" | grep -Fq "$sym" || { echo "MISSING symbol: $sym"; exit 1; }
          done
          echo "symbol check ok"
          rm -rf "$EXTRACT"

      - name: Collect Repack Files
        run: |
          set -euo pipefail
          mkdir -p ./repack
          DEB=$(find ./packages -name "*.deb" | head -n 1)
          test -n "$DEB"
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          find "$EXTRACT" -name "AxsHoldLaunch.dylib" -exec cp {} ./repack/ \;
          find "$EXTRACT" -name "AxsHoldLaunch.plist" -exec cp {} ./repack/ \;
          ls -la ./repack

      - name: Package 2.0.5+beautify.40 (dpkg-deb)
        env:
          AXS_DYLIB: ${{ github.workspace }}/repack/AxsHoldLaunch.dylib
        run: |
          set -euo pipefail
          sh packaging/package_beautify.sh

      - name: Verify final beautify deb
        run: |
          set -euo pipefail
          DEB=$(find ./packaging/out -name "*.deb" | head -n 1)
          test -n "$DEB"
          echo "=== dpkg-deb -I ==="
          dpkg-deb -I "$DEB"
          echo "=== version check ==="
          dpkg-deb -f "$DEB" Version | grep -qx "2.0.5+beautify.40"
          echo "=== package contents ==="
          dpkg-deb -c "$DEB"
          echo "=== bplist check (panel plist/strings) ==="
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          B="$EXTRACT/var/jb/Library/PreferenceBundles/ScreenCorePrefs.bundle"
          head -c 8 "$B/SplitSettings.plist" | grep -q "bplist00"
          head -c 8 "$B/zh-Hans.lproj/SplitSettings.strings" | grep -q "bplist00"
          head -c 8 "$B/en.lproj/SplitSettings.strings" | grep -q "bplist00"
          echo "=== beautify.40 panel cleanup check ==="
          # edge-icon switch must be gone from the panel plist
          strings -a "$B/SplitSettings.plist" | grep -Fq "splitBeautifyEdgeIconEnabled" && { echo "edge icon switch still in plist"; exit 1; }
          strings -a "$B/zh-Hans.lproj/SplitSettings.strings" | grep -Fq "BEAUTIFY_EDGE_ICON" && { echo "BEAUTIFY_EDGE_ICON still in zh strings"; exit 1; }
          strings -a "$B/en.lproj/SplitSettings.strings" | grep -Fq "BEAUTIFY_EDGE_ICON" && { echo "BEAUTIFY_EDGE_ICON still in en strings"; exit 1; }
          # original dock icon switch must remain
          strings -a "$B/SplitSettings.plist" | grep -Fq "splitDockIconEnabled" || { echo "splitDockIconEnabled missing"; exit 1; }
          # slider value format must be exact two decimals
          DYLIB34=$(find "$EXTRACT" -name "AxsHoldLaunch.dylib" | head -n 1)
          test -n "$DYLIB34"
          strings -a "$DYLIB34" | grep -Fq "%.2f" || { echo "%.2f format missing"; exit 1; }
          echo "=== beautify.40 slider compact check (source-level) ==="
          # compact geometry: title 78 / value 38 / glyph 18 / hot zone 28
          grep -Fq "constraintEqualToConstant:78" Hooks/AxsHoldLaunchMain.xm || { echo "title width 78 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:38" Hooks/AxsHoldLaunchMain.xm || { echo "value width 38 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:18" Hooks/AxsHoldLaunchMain.xm || { echo "glyph 18 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:28" Hooks/AxsHoldLaunchMain.xm || { echo "hot zone 28 missing"; exit 1; }
          # old .36 geometry must be gone
          grep -Eq "constraintEqualToConstant:(92|44|30|22)" Hooks/AxsHoldLaunchMain.xm && { echo "old .36 slider geometry still present"; exit 1; }
          # no stray title font sizes (group titles/footers render elsewhere)
          ! grep -nE "systemFontOfSize:(11|13|15|17|20)[^0-9]" Hooks/AxsHoldLaunchMain.xm || { echo "stray non-12pt title font"; exit 1; }
          # deep sweep + compact thumb/track wired in
          grep -Fq "axs_ring_page_applyUnifiedFontDeep" Hooks/AxsHoldLaunchMain.xm || { echo "deep font sweep missing"; exit 1; }
          grep -Fq "axs_ring_page_sliderThumbImage" Hooks/AxsHoldLaunchMain.xm || { echo "compact thumb missing"; exit 1; }
          echo "=== beautify.40 dylib selector check ==="
          strings -a "$DYLIB34" | grep -Fq "setThumbImage:forState:" || { echo "thumb selector missing"; exit 1; }
          strings -a "$DYLIB34" | grep -Fq "setMinimumTrackImage:forState:" || { echo "track selector missing"; exit 1; }
          echo "=== beautify.40 decor master switch check ==="
          strings -a "$DYLIB34" | grep -Fq "splitBeautifyDecorEnabled" || { echo "decor master key missing from dylib"; exit 1; }
          strings -a "$B/SplitSettings.plist" | grep -Fq "splitBeautifyDecorEnabled" || { echo "decor master key missing from plist"; exit 1; }
          python3 - <<PYEOF
          import plistlib, sys
          b = "$B/"
          pl = plistlib.load(open(b + "SplitSettings.plist", "rb"), fmt=plistlib.FMT_BINARY)
          keys = [it.get("key") for it in pl["items"] if it.get("key")]
          order = ["splitBeautifyRingFrameEnabled", "splitBeautifyRingCustomColorEnabled",
                   "splitBeautifyRingFrameColor", "splitBeautifyDecorEnabled",
                   "splitBeautifyGlowEnabled", "splitBeautifyGlowCustomEnabled",
                   "splitBeautifyGlowColor", "splitBeautifyRingThickness",
                   "splitBeautifyGlowRadius", "splitBeautifyGlowBrightness"]
          idx = [keys.index(k) for k in order]
          if idx != sorted(idx):
              sys.exit("beautify group order wrong: %r" % idx)
          zh = plistlib.load(open(b + "zh-Hans.lproj/SplitSettings.strings", "rb"), fmt=plistlib.FMT_BINARY)
          if zh.get("BEAUTIFY_DECOR_ENABLED") != "小窗边框美化":
              sys.exit("zh BEAUTIFY_DECOR_ENABLED wrong: %r" % zh.get("BEAUTIFY_DECOR_ENABLED"))
          if zh.get("BEAUTIFY_RING_THICKNESS") != "光圈粗细设置":
              sys.exit("zh BEAUTIFY_RING_THICKNESS wrong: %r" % zh.get("BEAUTIFY_RING_THICKNESS"))
          if "边框粗细设置" in zh.values():
              sys.exit("old zh copy 边框粗细设置 still present")
          en = plistlib.load(open(b + "en.lproj/SplitSettings.strings", "rb"), fmt=plistlib.FMT_BINARY)
          if not en.get("BEAUTIFY_DECOR_ENABLED"):
              sys.exit("en BEAUTIFY_DECOR_ENABLED missing")
          print("beautify.40 decor checks ok: order + zh copy + en label")
          PYEOF
          echo "=== beautify.40 master switch scope check (source-level) ==="
          # .39 bug pattern must be gone: master gate inside the pure sub-switch readers
          ! grep -Fq "if (!axs_ring_decorEnabled()) return NO;" Hooks/AxsBeautifyRing.xm || { echo ".39 gate pattern still in sub-switch readers"; exit 1; }
          # master must appear ONLY in decor-layer visibility decisions (7 = decl+def+5 call sites)
          test "$(grep -c "axs_ring_decorEnabled" Hooks/AxsBeautifyRing.xm)" -eq 7 || { echo "decorEnabled call sites changed (expected 7)"; exit 1; }
          grep -Fq "ring.hidden = !(axs_ring_decorEnabled() && axs_ring_enabled());" Hooks/AxsBeautifyRing.xm || { echo "attach ring visibility gate missing"; exit 1; }
          grep -Fq "BOOL showGlow = axs_ring_decorEnabled() && axs_ring_glowEnabled();" Hooks/AxsBeautifyRing.xm || { echo "attach glow visibility gate missing"; exit 1; }
          grep -Fq "!axs_ring_decorEnabled() || !axs_ring_glowEnabled()" Hooks/AxsBeautifyRing.xm || { echo "applyGlow hide gate missing"; exit 1; }
          grep -Fq "BOOL ringOn = axs_ring_decorEnabled() && axs_ring_enabled();" Hooks/AxsBeautifyRing.xm || { echo "refresh ring gate missing"; exit 1; }
          grep -Fq "BOOL glowOn = axs_ring_decorEnabled() && axs_ring_glowEnabled();" Hooks/AxsBeautifyRing.xm || { echo "refresh glow gate missing"; exit 1; }
          echo "final verify ok"
          rm -rf "$EXTRACT"

      - name: Upload Beautify Package
        uses: actions/upload-artifact@v4
        with:
          name: beautify-package
          path: packaging/out/*.deb
          if-no-files-found: error
