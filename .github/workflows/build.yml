name: Build ScreenCore beautify.155 (rootless)

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'macOS runner pool (switch pools if one is congested)'
        required: false
        default: 'macos-15'
        type: choice
        options:
          - macos-15
          - macos-15-intel
          - macos-13
          - macos-14

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build rootless beautify.155
    runs-on: ${{ inputs.runner_label || 'macos-15' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Pin Package Version
        run: |
          # The final deliverable version is fixed; do NOT use 5.2.0-run_number.
          VERSION="2.0.5+beautify.155"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build dependencies
        run: |
          brew install dpkg xz file coreutils findutils gnu-sed ldid-procursus
          # patch.sh (roothide conversion) calls plain `realpath`; coreutils ships grealpath
          ln -sf "$(brew --prefix coreutils)/bin/grealpath" "$(brew --prefix)/bin/realpath"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build Tweak (rootless, arm64 + arm64e)
        run: |
          set -euo pipefail
          sh build.sh rootless
          echo "=== intermediate .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Verify compiled dylib (arches + symbols)
        run: |
          set -euo pipefail
          EXTRACT="$(mktemp -d)"
          DEB=$(find ./packages -name "*.deb" | head -n 1)
          test -n "$DEB"
          dpkg-deb -x "$DEB" "$EXTRACT"
          DYLIB=$(find "$EXTRACT" -name "AxsHoldLaunch.dylib" | head -n 1)
          test -n "$DYLIB"
          echo "=== lipo -archs ==="
          lipo -archs "$DYLIB"
          lipo -archs "$DYLIB" | grep -q "arm64"
          lipo -archs "$DYLIB" | grep -q "arm64e"
          echo "=== required symbols ==="
          # materialize strings once: grep -q on a pipe closes early -> SIGPIPE makes
          # strings "failed to flush output" and pipefail fails the step spuriously.
          strings -a "$DYLIB" > "$EXTRACT/dylib.strings"
          for sym in splitBeautifyRingFrameColor UIColorPickerViewController com.susudear.screencoreprefs \
                     colorPickerViewControllerDidFinish: colorPickerViewControllerDidSelectColor: \
                     colorPickerControllerDidFinish: \
                     splitBeautifyGlowEnabled splitBeautifyGlowCustomEnabled \
                     splitBeautifyGlowColor splitBeautifyGlowRadius \
                     splitBeautifyGlowBrightness ; do
            grep -Fq "$sym" "$EXTRACT/dylib.strings" || { echo "MISSING symbol: $sym"; exit 1; }
          done
          echo "symbol check ok"
          rm -rf "$EXTRACT"

      - name: Collect Repack Files
        run: |
          set -euo pipefail
          mkdir -p ./repack
          DEB=$(find ./packages -name "*.deb" | head -n 1)
          test -n "$DEB"
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          find "$EXTRACT" -name "AxsHoldLaunch.dylib" -exec cp {} ./repack/ \;
          find "$EXTRACT" -name "AxsHoldLaunch.plist" -exec cp {} ./repack/ \;
          ls -la ./repack

      - name: Package 2.0.5+beautify.155 (dpkg-deb)
        env:
          AXS_DYLIB: ${{ github.workspace }}/repack/AxsHoldLaunch.dylib
        run: |
          set -euo pipefail
          # brew bin first: patch.sh requires the Procursus ldid fork
          # (ldid-procursus formula) for its -Hsha256 re-signing step.
          PATH="$(brew --prefix)/bin:$PATH" sh packaging/package_beautify.sh

      - name: Verify final beautify deb
        run: |
          set -euo pipefail
          DEB=$(find ./packaging/out -name "*.deb" ! -name "*roothide*" | head -n 1)
          test -n "$DEB"
          echo "=== rootless deb: $DEB ==="
          echo "=== dpkg-deb -I ==="
          dpkg-deb -I "$DEB"
          echo "=== version check ==="
          dpkg-deb -f "$DEB" Version | grep -qx "2.0.5+beautify.155"
          echo "=== package contents ==="
          dpkg-deb -c "$DEB"
          echo "=== bplist check (panel plist/strings) ==="
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          B="$EXTRACT/var/jb/Library/PreferenceBundles/ScreenCorePrefs.bundle"
          head -c 8 "$B/SplitSettings.plist" | grep -q "bplist00"
          head -c 8 "$B/zh-Hans.lproj/SplitSettings.strings" | grep -q "bplist00"
          head -c 8 "$B/en.lproj/SplitSettings.strings" | grep -q "bplist00"
          # dump strings once per artifact: grep -q on a pipe closes early ->
          # strings SIGPIPE / "failed to flush output" spuriously fails under pipefail.
          strings -a "$B/SplitSettings.plist" > "$EXTRACT/plist.strings"
          strings -a "$B/zh-Hans.lproj/SplitSettings.strings" > "$EXTRACT/zh.strings"
          strings -a "$B/en.lproj/SplitSettings.strings" > "$EXTRACT/en.strings"
          echo "=== beautify.95 panel cleanup check ==="
          # edge-icon switch must be gone from the panel plist
          grep -Fq "splitBeautifyEdgeIconEnabled" "$EXTRACT/plist.strings" && { echo "edge icon switch still in plist"; exit 1; }
          grep -Fq "BEAUTIFY_EDGE_ICON" "$EXTRACT/zh.strings" && { echo "BEAUTIFY_EDGE_ICON still in zh strings"; exit 1; }
          grep -Fq "BEAUTIFY_EDGE_ICON" "$EXTRACT/en.strings" && { echo "BEAUTIFY_EDGE_ICON still in en strings"; exit 1; }
          # original dock icon switch must remain
          grep -Fq "splitDockIconEnabled" "$EXTRACT/plist.strings" || { echo "splitDockIconEnabled missing"; exit 1; }
          # slider value format must be exact two decimals
          DYLIB34=$(find "$EXTRACT" -name "AxsHoldLaunch.dylib" | head -n 1)
          test -n "$DYLIB34"
          strings -a "$DYLIB34" > "$EXTRACT/dylib34.strings"
          grep -Fq "%.2f" "$EXTRACT/dylib34.strings" || { echo "%.2f format missing"; exit 1; }
          echo "=== beautify.95 slider compact check (source-level) ==="
          # compact geometry: title 78 / value 38 / glyph 18 / hot zone 28
          grep -Fq "constraintEqualToConstant:78" Hooks/AxsHoldLaunchMain.xm || { echo "title width 78 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:38" Hooks/AxsHoldLaunchMain.xm || { echo "value width 38 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:18" Hooks/AxsHoldLaunchMain.xm || { echo "glyph 18 missing"; exit 1; }
          grep -Fq "constraintEqualToConstant:28" Hooks/AxsHoldLaunchMain.xm || { echo "hot zone 28 missing"; exit 1; }
          # old .36 geometry must be gone
          grep -Eq "constraintEqualToConstant:(92|44|30|22)" Hooks/AxsHoldLaunchMain.xm && { echo "old .36 slider geometry still present"; exit 1; }
          # no stray title font sizes (group titles/footers render elsewhere)
          ! grep -nE "systemFontOfSize:(11|13|15|17|20)[^0-9]" Hooks/AxsHoldLaunchMain.xm || { echo "stray non-12pt title font"; exit 1; }
          # deep sweep + compact thumb/track wired in
          grep -Fq "axs_ring_page_applyUnifiedFontDeep" Hooks/AxsHoldLaunchMain.xm || { echo "deep font sweep missing"; exit 1; }
          grep -Fq "axs_ring_page_sliderThumbImage" Hooks/AxsHoldLaunchMain.xm || { echo "compact thumb missing"; exit 1; }
          echo "=== beautify.95 dylib selector check ==="
          grep -Fq "setThumbImage:forState:" "$EXTRACT/dylib34.strings" || { echo "thumb selector missing"; exit 1; }
          grep -Fq "setMinimumTrackImage:forState:" "$EXTRACT/dylib34.strings" || { echo "track selector missing"; exit 1; }
          echo "=== beautify.95 decor master switch check ==="
          grep -Fq "splitBeautifyDecorEnabled" "$EXTRACT/dylib34.strings" || { echo "decor master key missing from dylib"; exit 1; }
          grep -Fq "splitBeautifyDecorEnabled" "$EXTRACT/plist.strings" || { echo "decor master key missing from plist"; exit 1; }
          grep -Fq "splitBeautifyTiltEnabled" "$EXTRACT/dylib34.strings" || { echo "tilt enabled key missing from dylib"; exit 1; }
          grep -Fq "splitBeautifyTiltAngle" "$EXTRACT/dylib34.strings" || { echo "tilt angle key missing from dylib"; exit 1; }
          # one-decimal format wired for tilt angle slider, two decimals kept elsewhere
          grep -Fq 'isEqualToString:@"splitBeautifyTiltAngle"' Hooks/AxsHoldLaunchMain.xm || { echo "tilt angle precision key check missing"; exit 1; }
          grep -Fq 'stringWithFormat:@"%.1f"' Hooks/AxsHoldLaunchMain.xm || { echo "one-decimal format missing"; exit 1; }
          # beautify.95：业务层把保存值夹紧到 0..AXS_TILT_ANGLE_MAX(12)，默认 3.0
          grep -Fq 'axs_ring_clamp([v isKindOfClass:[NSNumber class]] ? [v doubleValue] : 3.0, 0.0, AXS_TILT_ANGLE_MAX)' Hooks/AxsBeautifyRing.xm || { echo "tilt angle clamp to AXS_TILT_ANGLE_MAX missing"; exit 1; }
          grep -Fq 'axs_ring_clamp(axs_ring_tiltAngle(), 0.0, AXS_TILT_ANGLE_MAX)' Hooks/AxsBeautifyRing.xm || { echo "applyTilt angle clamp to AXS_TILT_ANGLE_MAX missing"; exit 1; }
          grep -Fq '#define AXS_TILT_ANGLE_MAX    (30.0)' Hooks/AxsBeautifyRing.xm || { echo "AXS_TILT_ANGLE_MAX 12 missing"; exit 1; }
          python3 - <<PYEOF
          import plistlib, sys
          b = "$B/"
          pl = plistlib.load(open(b + "SplitSettings.plist", "rb"), fmt=plistlib.FMT_BINARY)
          keys = [it.get("key") for it in pl["items"] if it.get("key")]
          order = ["splitBeautifyRingFrameEnabled", "splitBeautifyRingCustomColorEnabled",
                   "splitBeautifyRingFrameColor", "splitBeautifyDecorEnabled",
                   "splitBeautifyTiltEnabled", "splitBeautifyTiltAngle",
                   "splitBeautifyGlowEnabled", "splitBeautifyGlowCustomEnabled",
                   "splitBeautifyGlowColor", "splitBeautifyRingThickness",
                   "splitBeautifyGlowRadius", "splitBeautifyGlowBrightness"]
          idx = [keys.index(k) for k in order]
          if idx != sorted(idx):
              sys.exit("beautify group order wrong: %r" % idx)
          # tilt rows must sit immediately after decor switch, before glow switch
          if keys[keys.index("splitBeautifyDecorEnabled")+1:keys.index("splitBeautifyDecorEnabled")+3] \
             != ["splitBeautifyTiltEnabled", "splitBeautifyTiltAngle"]:
              sys.exit("tilt rows not right after decor switch")
          tilt = [it for it in pl["items"] if it.get("key") == "splitBeautifyTiltAngle"][0]
          if tilt.get("cell") != "PSSliderCell" or tilt.get("min") != 0.0 \
             or tilt.get("max") != 30.0 or tilt.get("step") != 0.5 or tilt.get("default") != 3.0:
              sys.exit("tilt angle slider spec wrong (expect 0..12 default 3): %r" % tilt)
          tiltsw = [it for it in pl["items"] if it.get("key") == "splitBeautifyTiltEnabled"][0]
          if tiltsw.get("cell") != "PSSwitchCell" or tiltsw.get("default") is not False:
              sys.exit("tilt enabled switch spec wrong: %r" % tiltsw)
          zh = plistlib.load(open(b + "zh-Hans.lproj/SplitSettings.strings", "rb"), fmt=plistlib.FMT_BINARY)
          if zh.get("BEAUTIFY_DECOR_ENABLED") != "小窗边框美化":
              sys.exit("zh BEAUTIFY_DECOR_ENABLED wrong: %r" % zh.get("BEAUTIFY_DECOR_ENABLED"))
          if zh.get("BEAUTIFY_RING_THICKNESS") != "光圈粗细设置":
              sys.exit("zh BEAUTIFY_RING_THICKNESS wrong: %r" % zh.get("BEAUTIFY_RING_THICKNESS"))
          if "边框粗细设置" in zh.values():
              sys.exit("old zh copy 边框粗细设置 still present")
          if zh.get("BEAUTIFY_TILT_ENABLED") != "侧倾功能开关" \
             or len(zh.get("BEAUTIFY_TILT_ENABLED", "")) != 6:
              sys.exit("zh BEAUTIFY_TILT_ENABLED must be exactly 6 chars 侧倾功能开关")
          if zh.get("BEAUTIFY_TILT_ANGLE") != "侧倾角度设置" \
             or len(zh.get("BEAUTIFY_TILT_ANGLE", "")) != 6:
              sys.exit("zh BEAUTIFY_TILT_ANGLE must be exactly 6 chars 侧倾角度设置")
          en = plistlib.load(open(b + "en.lproj/SplitSettings.strings", "rb"), fmt=plistlib.FMT_BINARY)
          if not en.get("BEAUTIFY_DECOR_ENABLED"):
              sys.exit("en BEAUTIFY_DECOR_ENABLED missing")
          if not en.get("BEAUTIFY_TILT_ENABLED") or not en.get("BEAUTIFY_TILT_ANGLE"):
              sys.exit("en tilt labels missing")
          print("beautify.95 decor+tilt panel checks ok: order + zh 6-char copy + en labels")
          PYEOF
          echo "=== beautify.95 master switch scope check (source-level) ==="
          # .39 bug pattern must be gone: master gate inside the pure sub-switch readers
          ! grep -Fq "if (!axs_ring_decorEnabled()) return NO;" Hooks/AxsBeautifyRing.xm || { echo ".39 gate pattern still in sub-switch readers"; exit 1; }
          # master appears in: decl + def + 2 per-type helpers + 2 classify logs = 6;
          # scanTick / attach guard / detach path have none (count would drift if leaked)
          test "$(grep -c "axs_ring_decorEnabled" Hooks/AxsBeautifyRing.xm)" -eq 6 || { echo "decorEnabled occurrences changed (expected 6)"; exit 1; }
          # per-container docked classification wired
          grep -Fq "static BOOL axs_ring_containerIsDocked(UIView *container)" Hooks/AxsBeautifyRing.xm || { echo "docked classifier missing"; exit 1; }
          grep -Fq "respondsToSelector:@selector(isDocked)" Hooks/AxsBeautifyRing.xm || { echo "internal isDocked probe missing"; exit 1; }
          grep -Fq "renderScale > 0.92" Hooks/AxsBeautifyRing.xm || { echo "geometry 45% centerLarge rule missing"; exit 1; }
          grep -Fq "leftGap <= 24.0" Hooks/AxsBeautifyRing.xm || { echo "geometry 80pt edge rule missing"; exit 1; }
          grep -Fq "static BOOL axs_ring_ringAllowedFor(BOOL docked, UIView *container)" Hooks/AxsBeautifyRing.xm || { echo "ringAllowedFor missing"; exit 1; }
          grep -Fq "static BOOL axs_ring_glowAllowedFor(BOOL docked, UIView *container)" Hooks/AxsBeautifyRing.xm || { echo "glowAllowedFor missing"; exit 1; }
          # attach: classification + per-container gates
          grep -Fq "BOOL docked = axs_ring_containerIsDocked(container);" Hooks/AxsBeautifyRing.xm || { echo "attach docked classify missing"; exit 1; }
          grep -Fq "driver.ring.hidden = !ringAllowed;" Hooks/AxsBeautifyRing.xm || { echo "sync per-frame visibility missing"; exit 1; }
          grep -Fq "BOOL glowOn = axs_ring_glowAllowedFor(docked, container);" Hooks/AxsBeautifyRing.xm || { echo "sync glow per-type gate missing"; exit 1; }
          grep -Fq "BOOL docked = axs_ring_containerIsDocked(d.container);" Hooks/AxsBeautifyRing.xm || { echo "refresh per-driver classify missing"; exit 1; }
          grep -Fq "!axs_ring_glowAllowedFor(axs_ring_containerIsDocked(driver.container), driver.container)" Hooks/AxsBeautifyRing.xm || { echo "applyGlow per-container gate missing"; exit 1; }
          test "$(grep -c "decor classify" Hooks/AxsBeautifyRing.xm)" -eq 2 || { echo "classify log missing (expect attach + sync)"; exit 1; }
          echo "=== beautify.95 regression fix check (source-level) ==="
          # .42 idle-pause machinery must be fully rolled back (指令 三.1/三.2)
          ! grep -Fq "self.link.paused = YES;" Hooks/AxsBeautifyRing.xm || { echo ".42 idle pause still present"; exit 1; }
          ! grep -Fq "BOOL needsSync" Hooks/AxsBeautifyRing.xm || { echo "needsSync flag still present"; exit 1; }
          ! grep -Fq "BOOL wasAnimating" Hooks/AxsBeautifyRing.xm || { echo "wasAnimating flag still present"; exit 1; }
          ! grep -Fq "lastContFrame" Hooks/AxsBeautifyRing.xm || { echo "lastContFrame gate still present"; exit 1; }
          ! grep -Fq "axs_ring_resumeAllLinks" Hooks/AxsBeautifyRing.xm || { echo "resumeAllLinks still present"; exit 1; }
          ! grep -Fq ".link.paused" Hooks/AxsBeautifyRing.xm || { echo "link paused still present"; exit 1; }
          # tick 一帧不早退：直接调用 syncDriver（指令 三.1/三.3）
          grep -Fq "axs_ring_syncDriver(self);" Hooks/AxsBeautifyRing.xm || { echo "tick->syncDriver missing"; exit 1; }
          # per-driver 状态记录 + visChanged 视为 changed 项（指令 六.1/六.5）
          grep -Fq "BOOL lastIsDocked" Hooks/AxsBeautifyRing.xm || { echo "lastIsDocked missing"; exit 1; }
          grep -Fq "BOOL lastRingAllowed" Hooks/AxsBeautifyRing.xm || { echo "lastRingAllowed missing"; exit 1; }
          grep -Fq "BOOL lastGlowAllowed" Hooks/AxsBeautifyRing.xm || { echo "lastGlowAllowed missing"; exit 1; }
          grep -Fq "BOOL visChanged" Hooks/AxsBeautifyRing.xm || { echo "visChanged missing"; exit 1; }
          grep -Fq "BOOL changed = visChanged" Hooks/AxsBeautifyRing.xm || { echo "state-change not treated as changed"; exit 1; }
          # hidden/alpha 在几何 changed 之前同步提交，关隐式动画（指令 三.4/三.6/六.3）
          grep -Fq "[CATransaction setDisableActions:YES];" Hooks/AxsBeautifyRing.xm || { echo "disableActions missing"; exit 1; }
          grep -Fq "driver.ring.hidden = !ringAllowed;" Hooks/AxsBeautifyRing.xm || { echo "ring hidden commit missing"; exit 1; }
          grep -Fq "driver.ring.opacity = ringAllowed ? 1.0 : 0.0;" Hooks/AxsBeautifyRing.xm || { echo "ring alpha commit missing"; exit 1; }
          grep -Fq "driver.glowInner.hidden = !glowAllowed;" Hooks/AxsBeautifyRing.xm || { echo "glow hidden commit missing"; exit 1; }
          grep -Fq "static void axs_ring_syncAllDriversNow(void)" Hooks/AxsBeautifyRing.xm || { echo "event sync helper missing"; exit 1; }
          grep -Fq "axs_ring_syncAllDriversNow();" Hooks/AxsBeautifyRing.xm || { echo "event sync call missing"; exit 1; }
          # 无 shouldRasterize / fade 残留（指令 三.7/三.6）
          ! grep -Fq "shouldRasterize" Hooks/AxsBeautifyRing.xm || { echo "shouldRasterize still present"; exit 1; }
          echo "=== beautify.95 safe optimizations kept (source-level) ==="
          grep -Fq "static void axs_ring_queueScan(void)" Hooks/AxsBeautifyRing.xm || { echo "scan dedupe missing"; exit 1; }
          grep -Fq "axs_ring_queueScan();" Hooks/AxsBeautifyRing.xm || { echo "queueScan call missing"; exit 1; }
          # layer/mask cache-first (no per-frame findMount/findRealClip/selectMask)
          grep -Fq "CALayer *mount = driver.mountLayer;" Hooks/AxsBeautifyRing.xm || { echo "mount cache-first missing"; exit 1; }
          grep -Fq "driver.realLayer.superlayer == nil" Hooks/AxsBeautifyRing.xm || { echo "realLayer cache validity missing"; exit 1; }
          grep -Fq "driver.radiusMask.superlayer == nil" Hooks/AxsBeautifyRing.xm || { echo "radiusMask cache validity missing"; exit 1; }
          # geometry slimming: path/gradient/glow caches
          grep -Fq "driver.lastPathBounds" Hooks/AxsBeautifyRing.xm || { echo "path cache missing"; exit 1; }
          grep -Fq "driver.lastGradientDiag" Hooks/AxsBeautifyRing.xm || { echo "gradient cache missing"; exit 1; }
          grep -Fq "driver.lastGlowGeomBounds" Hooks/AxsBeautifyRing.xm || { echo "glow geom cache missing"; exit 1; }
          grep -Fq "BOOL geomChanged, BOOL colorChanged" Hooks/AxsBeautifyRing.xm || { echo "glow split rebuild missing"; exit 1; }
          # prefs snapshot: all config reads funnel through refreshConfigSnapshot
          grep -Fq "static void axs_ring_refreshConfigSnapshot(void)" Hooks/AxsBeautifyRing.xm || { echo "config snapshot missing"; exit 1; }
          test "$(grep -c "axs_holdlaunch_theirValueForKey" Hooks/AxsBeautifyRing.xm)" -eq 15 || { echo "config reads drifted (expected 15 = 14 snapshot reads incl. debug mode + 1 selector)"; exit 1; }
          grep -Fq "axs_ring_refreshConfigSnapshot();" Hooks/AxsBeautifyRing.xm || { echo "snapshot refresh call missing"; exit 1; }
          echo "=== beautify.95 side-tilt feature check (source-level) ==="
          # config getters (snapshot reads)
          grep -Fq "static BOOL axs_ring_tiltEnabled(void)" Hooks/AxsBeautifyRing.xm || { echo "tiltEnabled getter missing"; exit 1; }
          grep -Fq "static double axs_ring_tiltAngle(void)" Hooks/AxsBeautifyRing.xm || { echo "tiltAngle getter missing"; exit 1; }
          # per-driver docked-side probe (internal state first, geometry fallback)
          grep -Fq "static int axs_ring_containerDockSide(UIView *container)" Hooks/AxsBeautifyRing.xm || { echo "dock side probe missing"; exit 1; }
          grep -Fq "isLeftDocked" Hooks/AxsBeautifyRing.xm || { echo "left side internal probe missing"; exit 1; }
          grep -Fq "isRightDocked" Hooks/AxsBeautifyRing.xm || { echo "right side internal probe missing"; exit 1; }
          # beautify.95: 3D card side-flip — rotationY around Y axis + m34 perspective, NOT 2D rotation.z
          grep -Fq "CATransform3DRotate(CATransform3DIdentity, (CGFloat)rad, 0.0, 1.0, 0.0)" Hooks/AxsBeautifyRing.xm || { echo "rotationY transform missing"; exit 1; }
          ! grep -Fq "CATransform3DMakeRotation((CGFloat)rad, 0.0, 0.0, 1.0)" Hooks/AxsBeautifyRing.xm || { echo "old 2D rotation.z tilt still present"; exit 1; }
          # .65 核心根因修复：m34 必须经 R·P 复合写入 m14/m34，不能只塞 m34（对 z=0 平面透视失效）
          grep -Fq "tiltRotation.m14 = -sinRad * AXS_TILT_M34;" Hooks/AxsBeautifyRing.xm || { echo "m14 perspective term missing (.65 root fix)"; exit 1; }
          grep -Fq "tiltRotation.m34 =  cosRad * AXS_TILT_M34;" Hooks/AxsBeautifyRing.xm || { echo "m34*cos perspective term missing (.65 root fix)"; exit 1; }
          ! grep -Fq "tiltRotation.m34 = AXS_TILT_M34;" Hooks/AxsBeautifyRing.xm || { echo "old broken m34-only write still present"; exit 1; }
          grep -Fq "#define AXS_TILT_PERSPECTIVE_GAIN  (2.6)" Hooks/AxsBeautifyRing.xm || { echo "perspective gain missing"; exit 1; }
          grep -Fq "rad = rad * AXS_TILT_PERSPECTIVE_GAIN;" Hooks/AxsBeautifyRing.xm || { echo "perspective gain application missing"; exit 1; }
          grep -Fq "side * angle * M_PI / 180.0" Hooks/AxsBeautifyRing.xm || { echo "tilt angle conversion missing"; exit 1; }
          # cleanBase 判定与复位必须清 3D 透视分量 m13/m31/m34，防累积/残留
