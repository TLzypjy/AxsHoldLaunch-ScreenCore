          grep -Fq "splitBeautifyDismissDensity" Hooks/AxsDismissEffect.xm || { echo "density key missing in source"; exit 1; }
          grep -Fq "splitBeautifyDismissDensity" "$EXTRACT/plist.strings" || { echo "density panel option missing"; exit 1; }
          grep -Fq "DISMISS_DENSITY" "$EXTRACT/zh.strings" || { echo "density zh label missing"; exit 1; }
          grep -Fq "DISMISS_DENSITY" "$EXTRACT/en.strings" || { echo "density en label missing"; exit 1; }
          grep -Fq "splitBeautifyDismissDensity" "$EXTRACT/dylib34.strings" || { echo "density key not compiled into dylib"; exit 1; }
          echo "=== beautify.155 ARC-open assemble animation check ==="
          grep -Fq "openMode" Hooks/AxsMetalSand.xm || { echo "shader openMode branch missing"; exit 1; }
          grep -Fq "axs_metalAssemblePlay" Hooks/AxsMetalSand.xm || { echo "assemble entry missing in Metal"; exit 1; }
          grep -Fq "axs_metalAssemblePlay" Hooks/AxsDismissEffect.xm || { echo "assemble call missing in dismiss"; exit 1; }
          grep -Fq "SCFloatingContainerView" Hooks/AxsDismissEffect.xm || { echo "open visibility hook missing"; exit 1; }
          grep -Fq "msgSendSuper" Hooks/AxsDismissEffect.xm || { echo "super-forward safety missing"; exit 1; }
          grep -Fq "axs_open_lastDismissHide" Hooks/AxsDismissEffect.xm || { echo "dismiss-restore suppression missing"; exit 1; }
          grep -Fq "splitBeautifyOpenAnimEnabled" Hooks/AxsDismissEffect.xm || { echo "open switch key missing in source"; exit 1; }
          grep -Fq "splitBeautifyOpenAnimEnabled" "$EXTRACT/plist.strings" || { echo "open switch panel option missing"; exit 1; }
          grep -Fq "BEAUTIFY_OPEN_ANIM" "$EXTRACT/zh.strings" || { echo "open zh label missing"; exit 1; }
          grep -Fq "BEAUTIFY_OPEN_ANIM" "$EXTRACT/en.strings" || { echo "open en label missing"; exit 1; }
          grep -Fq "splitBeautifyOpenAnimEnabled" "$EXTRACT/dylib34.strings" || { echo "open switch key not compiled into dylib"; exit 1; }
          echo "=== beautify.155 finger-source assemble + loop fix check ==="
          grep -Fq "sourcePoint" Hooks/AxsMetalSand.xm || { echo "shader sourcePoint missing"; exit 1; }
          grep -Fq "axs_open_sendEvent" Hooks/AxsDismissEffect.xm || { echo "finger-lift tracking missing"; exit 1; }
          grep -Fq "UITouchPhaseEnded" Hooks/AxsDismissEffect.xm || { echo "touch-ended filter missing"; exit 1; }
          grep -Fq "axs_open_selfRestore" Hooks/AxsDismissEffect.xm || { echo "self-restore loop guard missing"; exit 1; }
          grep -Fq "sendEvent:" Hooks/AxsDismissEffect.xm || { echo "sendEvent hook missing"; exit 1; }
          # .127: the native animation is swallowed (zero execution) and its
          # completion is fired manually
          grep -Fq "OPEN native animation replaced" Hooks/AxsDismissEffect.xm || { echo "animation swallow missing"; exit 1; }
          grep -Fq "animationDidStop:finished:" Hooks/AxsDismissEffect.xm || { echo "manual completion fire missing"; exit 1; }

          echo "=== beautify.155 particle-is-window reveal + no-open-loop check ==="
          # .144: a card stays "assembled" from the first frame of an open
          # until its real dismiss -- repeated presents / overlay cleanup must
          # NOT be re-read as a new open (that caused the auto-open loop).
          grep -Fq "static char axs_open_assembledKey;" Hooks/AxsDismissEffect.xm || { echo "assembled key missing"; exit 1; }
          grep -Fq "static void axs_open_setAssembled(UIView *v, BOOL yes)" Hooks/AxsDismissEffect.xm || { echo "assembled setter missing"; exit 1; }
          grep -Fq "if (axs_open_isAssembled(v))" Hooks/AxsDismissEffect.xm || { echo "assembled guard in becameVisible missing"; exit 1; }
          grep -Fq "candidate skipped (already assembled)" Hooks/AxsDismissEffect.xm || { echo "assembled skip log missing"; exit 1; }
          grep -Fq "axs_open_setAssembled(card, YES)" Hooks/AxsDismissEffect.xm || { echo "assembled mark-on-accept missing"; exit 1; }
          grep -Fq "axs_open_setAssembled(container, NO)" Hooks/AxsDismissEffect.xm || { echo "assembled release-on-dismiss missing"; exit 1; }
          # .149: self-healing state flags -- a stale assembled flag or an
          # orphaned one-shot selfRestore used to silently EAT the user's next
          # genuine open (no particles, card pops in). The flags now carry
          # timestamps; stale ones are released and the open re-assembles.
          grep -Fq "static CFAbsoluteTime axs_open_selfRestoreAt = -1e9;" Hooks/AxsDismissEffect.xm || { echo "selfRestore timestamp missing"; exit 1; }
          grep -Fq "static void axs_open_armSelfRestore(void)" Hooks/AxsDismissEffect.xm || { echo "armSelfRestore helper missing"; exit 1; }
          grep -Fq "axs_open_armSelfRestore();" Hooks/AxsDismissEffect.xm || { echo "arm sites not converted"; exit 1; }
          test "$(grep -cF 'axs_open_selfRestore = YES;' Hooks/AxsDismissEffect.xm)" -eq 1 || { echo "raw selfRestore assignment outside the arm helper"; exit 1; }
          grep -Fq "static CFAbsoluteTime axs_open_openActiveUntil = 0;" Hooks/AxsDismissEffect.xm || { echo "open ownership window missing"; exit 1; }
          grep -Fq "axs_open_openActiveUntil = CACurrentMediaTime() + duration + 0.3;" Hooks/AxsDismissEffect.xm || { echo "ownership window not armed on accept missing"; exit 1; }
          grep -Fq "OPEN stale assembled flag released, re-assembling" Hooks/AxsDismissEffect.xm || { echo "stale assembled self-heal missing"; exit 1; }
          grep -Fq "OPEN orphaned self-restore flag released, re-assembling" Hooks/AxsDismissEffect.xm || { echo "orphaned selfRestore self-heal missing"; exit 1; }
          grep -Fq "axs_open_selfRestoreAt > 0.6" Hooks/AxsDismissEffect.xm || { echo "selfRestore age check missing"; exit 1; }
          grep -Fq "candidate skipped (open still active" Hooks/AxsDismissEffect.xm || { echo "open-active event guard missing"; exit 1; }

          # .154: PARTICLE == WINDOW (reference-plugin idea, own code). One
          # .155: reference-style fine dust. Grains stay 1.15-2.4px colored
          # dots and die at arrival; the real card is revealed by a CPU mask
          # with the SAME per-cell hash/clock. No gradient board, no flash.
          grep -Fq "float3 axsPalette(float p)" Hooks/AxsMetalSand.xm || { echo "rainbow palette function missing"; exit 1; }
          grep -Fq "float4 position [[position]];" Hooks/AxsMetalSand.xm || { echo "vertex position missing"; exit 1; }
          grep -Fq "    float dock;" Hooks/AxsMetalSand.xm || { echo "dock varying missing"; exit 1; }
          grep -Fq "    float3 tint;" Hooks/AxsMetalSand.xm || { echo "tint varying missing"; exit 1; }
          grep -Fq "    float isOpen;" Hooks/AxsMetalSand.xm || { echo "isOpen varying missing"; exit 1; }
          grep -Fq "    float noiseX;" Hooks/AxsMetalSand.xm || { echo "dust noise varying missing"; exit 1; }
          grep -Fq "if (u.openMode == 1u) {" Hooks/AxsMetalSand.xm || { echo "open mode branch missing"; exit 1; }
          grep -Fq "uint h = uint(cell.x)*73856093u ^ uint(cell.y)*19349663u ^ 83492791u;" Hooks/AxsMetalSand.xm || { echo "per-cell integer hash missing"; exit 1; }
          grep -Fq "float hf = (float)(h & 0xffffu)/65535.0;" Hooks/AxsMetalSand.xm || { echo "hash normalization missing"; exit 1; }
          grep -Fq "float order = 0.96*(1.0-unit.y) + 0.04*hf;" Hooks/AxsMetalSand.xm || { echo "reference arrival order missing"; exit 1; }
          grep -Fq "float arrival = 0.35 + 0.65*order;" Hooks/AxsMetalSand.xm || { echo "staggered arrival missing"; exit 1; }
          grep -Fq "float departure = arrival - 0.35;" Hooks/AxsMetalSand.xm || { echo "staggered departure missing"; exit 1; }
          grep -Fq "float2 landing = (cell + 0.5 + jitter)/grid;" Hooks/AxsMetalSand.xm || { echo "jittered landing cell missing"; exit 1; }
          grep -Fq "float2 finger = float2(u.sourceX, u.sourceY);" Hooks/AxsMetalSand.xm || { echo "finger origin missing"; exit 1; }
          grep -Fq "float2 start = finger + float2(cos(ang), sin(ang))*(9.0 + 48.0*r4);" Hooks/AxsMetalSand.xm || { echo "finger burst missing"; exit 1; }
          grep -Fq "float2 dest = u.origin + landing*u.cardSize;" Hooks/AxsMetalSand.xm || { echo "per-cell window target missing"; exit 1; }
          grep -Fq "float2 pos = b*b*b*start + 3.0*b*b*t*c1 + 3.0*b*t*t*c2 + t*t*t*dest;" Hooks/AxsMetalSand.xm || { echo "cubic Bezier flight missing"; exit 1; }
          grep -Fq "float2 dustSize = float2(mix(1.15, 2.4, r3));" Hooks/AxsMetalSand.xm || { echo "fine dust size missing"; exit 1; }
          grep -Fq "float gone = 1.0 - step(arrival - 0.006, u.time);" Hooks/AxsMetalSand.xm || { echo "arrival delete gate missing"; exit 1; }
          grep -Fq "outO.fade=born*gone*(1.0-smoothstep(0.94,1.0,t));" Hooks/AxsMetalSand.xm || { echo "dust fade gate missing"; exit 1; }
          grep -Fq "outO.noiseX=r;" Hooks/AxsMetalSand.xm || { echo "dust noise output missing"; exit 1; }
          grep -Fq "out.isOpen=0.0;" Hooks/AxsMetalSand.xm || { echo "dismiss branch open flag reset missing"; exit 1; }
          grep -Fq "if (in.isOpen > 0.5) {" Hooks/AxsMetalSand.xm || { echo "fragment open branch missing"; exit 1; }
          grep -Fq "float roundDust=1.0-smoothstep(0.32,0.51,length(in.local-0.5));" Hooks/AxsMetalSand.xm || { echo "round dust shape missing"; exit 1; }
          grep -Fq "return float4(grain,1.0)*(roundDust*in.fade);" Hooks/AxsMetalSand.xm || { echo "dust fragment output missing"; exit 1; }
          grep -Fq "CFTimeInterval axs_metalAssembleStartTime(void *renderer)" Hooks/AxsMetalSand.xm || { echo "shared renderer clock accessor missing"; exit 1; }
          ! grep -Fq "float4 col=mix(flying,texel,in.dock);" Hooks/AxsMetalSand.xm || { echo "stale particle-as-window crossfade still present"; exit 1; }
          ! grep -Fq "float2 size = mix(dustSize, tileSize, dock);" Hooks/AxsMetalSand.xm || { echo "stale grain->tile growth still present"; exit 1; }
          ! grep -Fq "startWithCardIdle" Hooks/AxsDismissEffect.xm || { echo "stale idle driver anchor still present"; exit 1; }
          # density=3 must actually deliver full grains (no rows>240 truncation)
          grep -Fq "if (particles > 48000) particles = 48000" Hooks/AxsMetalSand.xm || { echo "grains cap raise missing"; exit 1; }
          grep -Fq "if (rows > 320) rows = 320" Hooks/AxsMetalSand.xm || { echo "rows clamp raise missing"; exit 1; }
          # .145: generated rainbow sand texture -- NO full-screen capture as
          # the primary grain source (that leaked the home-screen clock)
          grep -Fq "static UIImage *axs_open_sandTexture(void)" Hooks/AxsDismissEffect.xm || { echo "sand texture generator missing"; exit 1; }
          grep -Fq "CGGradientCreateWithColors" Hooks/AxsDismissEffect.xm || { echo "sand gradient missing"; exit 1; }
          grep -Fq "UIImage *tex = axs_open_sandTexture();" Hooks/AxsDismissEffect.xm || { echo "dust texture not used"; exit 1; }
          ! grep -Fq "UIImage *tex = axs_open_captureCardForAssembly(card);" Hooks/AxsDismissEffect.xm || { echo "stale hidden-card snapshot still present"; exit 1; }
          # .155: CPU per-cell reveal mask driven by the same shared clock.
          grep -Fq "@interface AXSOpenWipeDriver : NSObject" Hooks/AxsDismissEffect.xm || { echo "wipe driver class missing"; exit 1; }
          grep -Fq "static uint32_t axs_open_cellHash(uint32_t x, uint32_t y)" Hooks/AxsDismissEffect.xm || { echo "CPU cell hash missing"; exit 1; }
          grep -Fq "CGFloat progress = (raw - 0.35)/0.65 + 0.012;" Hooks/AxsDismissEffect.xm || { echo "shared reveal clock missing"; exit 1; }
          grep -Fq "CGPathAddLineToPoint(path, NULL, x, boundary*sz.height);" Hooks/AxsDismissEffect.xm || { echo "ragged reveal edge missing"; exit 1; }
          grep -Fq "axs_open_gridForDensity(density, frame" Hooks/AxsDismissEffect.xm || { echo "CPU grid sync missing"; exit 1; }
          grep -Fq "CFTimeInterval assemblyStart = axs_metalAssembleStartTime(renderer);" Hooks/AxsDismissEffect.xm || { echo "shared start not adopted"; exit 1; }
          grep -Fq "[driver startWithCard:card duration:dur sharedStart:sharedStart" Hooks/AxsDismissEffect.xm || { echo "reveal driver not started"; exit 1; }
          grep -Fq "card.layer.mask = ml;" Hooks/AxsDismissEffect.xm || { echo "reveal mask not applied"; exit 1; }
          grep -Fq "card.hidden = NO;" Hooks/AxsDismissEffect.xm || { echo "final card restore missing"; exit 1; }
          grep -Fq "axs_open_interceptUntil = 0" Hooks/AxsDismissEffect.xm || { echo "intercept disarm missing"; exit 1; }
          # .147: fallback source must be screen-bottom, never card center
          grep -Fq "screenH - 90.0" Hooks/AxsDismissEffect.xm || { echo "screen-bottom fallback source missing"; exit 1; }
          grep -Fq "@\"fallback-screen-bottom\"" Hooks/AxsDismissEffect.xm || { echo "screen-bottom fallback tag missing"; exit 1; }
          ! grep -Fq "@\"fallback-card-center\"" Hooks/AxsDismissEffect.xm || { echo "stale card-center fallback still present"; exit 1; }
          ! grep -Fq "card.layer.mask = mv.layer;" Hooks/AxsDismissEffect.xm || { echo "stale flat rect mask still present"; exit 1; }
          ! grep -Fq "mv.frame = CGRectMake(-ov, -ov, sz.width + 2 * ov, sz.height + ov);" Hooks/AxsDismissEffect.xm || { echo "stale flat mask expand still present"; exit 1; }
          ! grep -Fq "card.alpha = 0.0;" Hooks/AxsDismissEffect.xm || { echo "whole-card alpha fade still present"; exit 1; }
          ! grep -Fq "CGFloat revealAt = duration * 0.92;" Hooks/AxsDismissEffect.xm || { echo "stale instant card swap still present"; exit 1; }

          echo "=== beautify.155 GPU Metal fine-dust engine check ==="
          test -f Hooks/AxsMetalSand.xm || { echo "Metal engine source missing"; exit 1; }
          grep -Fq "nlDustVertex" Hooks/AxsMetalSand.xm || { echo "Metal shader vertex fn missing"; exit 1; }
          grep -Fq "nlDustFragment" Hooks/AxsMetalSand.xm || { echo "Metal shader fragment fn missing"; exit 1; }
          grep -Fq "CAMetalLayer" Hooks/AxsMetalSand.xm || { echo "CAMetalLayer missing"; exit 1; }
          grep -Fq "instanceCount:(NSUInteger)" Hooks/AxsMetalSand.xm || { echo "single instanced draw call missing"; exit 1; }
          grep -Fq "newLibraryWithSource" Hooks/AxsMetalSand.xm || { echo "runtime shader compile missing"; exit 1; }
          grep -Fq "axs_metalSandPlay" Hooks/AxsDismissEffect.xm || { echo "Metal hookup in dismiss missing"; exit 1; }
          grep -Fq "Metal QuartzCore" Makefile || { echo "Metal framework not linked"; exit 1; }
          grep -Fq "metal compiled OK pipeline ready" "$EXTRACT/dylib34.strings" || { echo "Metal compile log not compiled into dylib"; exit 1; }
          grep -Fq "metal started open=" "$EXTRACT/dylib34.strings" || { echo "Metal start log not compiled into dylib"; exit 1; }
          # .105 visibility fix assertions
          grep -Fq "MTLStorageModeShared" Hooks/AxsMetalSand.xm || { echo "shared texture storage fix missing"; exit 1; }
          grep -Fq "drawableSize = CGSizeMake" Hooks/AxsMetalSand.xm || { echo "drawable size fix missing"; exit 1; }
          grep -Fq "first-frame probe" Hooks/AxsMetalSand.xm || { echo "first-frame self-probe missing"; exit 1; }
          grep -Fq "metal first-frame probe" "$EXTRACT/dylib34.strings" || { echo "first-frame probe log not compiled into dylib"; exit 1; }
          # .106/.107 command queue fix assertions
          grep -Fq "id<MTLCommandQueue> sMsdQueue" Hooks/AxsMetalSand.xm || { echo "MTLCommandQueue singleton missing"; exit 1; }
          grep -Fq "sMsdQueue = [sMsdDevice newCommandQueue]" Hooks/AxsMetalSand.xm || { echo "command queue creation missing"; exit 1; }
          grep -Fq "@selector(commandBuffer)" Hooks/AxsMetalSand.xm || { echo "reference-plugin commandBuffer selector missing"; exit 1; }
          grep -Fq "[sMsdQueue respondsToSelector:cbSel]" Hooks/AxsMetalSand.xm || { echo "runtime selector probe missing"; exit 1; }
          grep -Fq "sMsdQueue, cbSel" Hooks/AxsMetalSand.xm || { echo "command buffer must be sent to queue, not device"; exit 1; }
          grep -Fq "metal queue exposes no command buffer selector" "$EXTRACT/dylib34.strings" || { echo "safe selector fallback log not compiled into dylib"; exit 1; }
          ! grep -Fq "sMsdDevice, @selector(newCommandBuffer)" Hooks/AxsMetalSand.xm || { echo "stale device newCommandBuffer call still present"; exit 1; }
          # .110: no manual texture flip -- a raw CGBitmapContext already lands
          # image top at row 0; the extra flip rendered the card upside down.
          grep -Fq "CGContextDrawImage(ctx, CGRectMake(0, 0, (CGFloat)w, (CGFloat)h), cg)" Hooks/AxsMetalSand.xm || { echo "plain texture draw missing"; exit 1; }
          ! grep -Fq "CGContextScaleCTM(ctx, 1, -1)" Hooks/AxsMetalSand.xm || { echo "stale texture flip still present (upside-down card)"; exit 1; }
          echo "=== roothide (hidden-root) variant verification ==="
          RH_DEB=$(find ./packaging/out -name "*roothide*.deb" | head -n 1)
          test -n "$RH_DEB" || { echo "roothide deb missing"; exit 1; }
          dpkg-deb -f "$RH_DEB" Version | grep -qx "2.0.5+beautify.155"
          # roothide bootstrap marker: Sileo installs arm64e directly, but pops
          # the "convert .deb" dialog for plain iphoneos-arm64 (rootless) debs.
          dpkg-deb -f "$RH_DEB" Architecture | grep -qx "iphoneos-arm64e" || { echo "roothide deb must be Architecture iphoneos-arm64e"; exit 1; }
          RH_EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$RH_DEB" "$RH_EXTRACT"
          # layout must be flattened: files directly under Library/usr, NO var/jb
          test -f "$RH_EXTRACT/Library/MobileSubstrate/DynamicLibraries/AxsHoldLaunch.dylib" || { echo "roothide dylib missing"; exit 1; }
          test -f "$RH_EXTRACT/Library/MobileSubstrate/DynamicLibraries/AxsHoldLaunch.plist" || { echo "roothide filter plist missing"; exit 1; }
          test -f "$RH_EXTRACT/Library/MobileSubstrate/DynamicLibraries/ScreenCore.dylib" || { echo "roothide ScreenCore dylib missing"; exit 1; }
          test -f "$RH_EXTRACT/Library/PreferenceBundles/ScreenCorePrefs.bundle/SplitSettings.plist" || { echo "roothide panel plist missing"; exit 1; }
          test ! -e "$RH_EXTRACT/var/jb" || { echo "roothide still has var/jb prefix"; exit 1; }
          # official Patcher conversion checks: rpaths must be rewritten away from
          # /var/jb, binary must carry a code signature, AutoPatches markers present
          AXSD="$RH_EXTRACT/Library/MobileSubstrate/DynamicLibraries/AxsHoldLaunch.dylib"
          if otool -l "$AXSD" | grep -Fq "path /var/jb"; then echo "roothide dylib still has /var/jb rpath"; exit 1; fi
          otool -l "$AXSD" | grep -Fq "path @loader_path/.jbroot/usr/lib" || { echo "roothide dylib missing .jbroot rpath"; exit 1; }
          codesign -dv "$AXSD" >/dev/null 2>&1 || { echo "roothide dylib has no code signature"; exit 1; }
          test -L "$AXSD.roothidepatch" || { echo "roothide AutoPatches marker missing"; exit 1; }
          dpkg-deb -f "$RH_DEB" Pre-Depends | grep -q "rootless-compat" || { echo "roothide deb missing Pre-Depends rootless-compat"; exit 1; }
          echo "roothide verify ok: $RH_DEB"
          rm -rf "$RH_EXTRACT"
          echo "final verify ok"
          rm -rf "$EXTRACT"

      - name: Upload Beautify Package
        uses: actions/upload-artifact@v4
        with:
          name: beautify-package
          path: packaging/out/*.deb
          if-no-files-found: error
